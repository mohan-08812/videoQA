<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <!-- Gradients for a modern aesthetic -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        
        <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#f43f5e"/>
        </linearGradient>

        <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>

        <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0ea5e9"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>

        <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#14b8a6"/>
        </linearGradient>

        <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>

        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <!-- Arrows -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Title -->
    <text x="600" y="80" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">VIDEOQA SYSTEM ARCHITECTURE</text>
    <text x="600" y="115" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">End-to-End Processing &amp; Inference Pipeline</text>

    <!-- Container for Backend -->
    <rect x="360" y="160" width="480" height="560" rx="24" ry="24" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" stroke-dasharray="12,6" />
    <text x="600" y="195" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">BACKEND FASTAPI SERVER</text>

    <!-- Lines / Connections -->

    <!-- UI <-> API -->
    <path d="M 270 380 L 410 380" stroke="#cbd5e1" stroke-width="4" fill="none" marker-end="url(#arrow)" />
    <text x="340" y="370" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">Upload / URL</text>
    <path d="M 410 420 L 270 420" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
    <text x="340" y="445" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#10b981" text-anchor="middle">Answer &amp; Clip</text>

    <!-- API -> yt-dlp -->
    <path d="M 600 350 L 600 280" stroke="#0ea5e9" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" />
    <text x="610" y="325" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0ea5e9">URL Input</text>

    <!-- yt-dlp -> External URL -->
    <path d="M 700 240 L 920 240" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-blue)" />
    <text x="810" y="230" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0ea5e9" text-anchor="middle">Fetch Stream</text>

    <!-- yt-dlp -> Video Processor -->
    <path d="M 500 240 L 390 240 L 390 525 L 460 525" stroke="#0ea5e9" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" />
    <text x="380" y="380" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0ea5e9" text-anchor="end">Video File</text>

    <!-- API -> Video Processor (Direct) -->
    <path d="M 600 450 L 600 480" stroke="#cbd5e1" stroke-width="4" fill="none" marker-end="url(#arrow)" />
    <text x="610" y="475" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Direct MP4</text>

    <!-- Video Processor -> Whisper -->
    <path d="M 560 560 L 480 560 L 480 610" stroke="#cbd5e1" stroke-width="4" fill="none" marker-end="url(#arrow)" />
    <text x="510" y="550" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">Audio</text>

    <!-- Video Processor -> BLIP -->
    <path d="M 640 560 L 720 560 L 720 610" stroke="#cbd5e1" stroke-width="4" fill="none" marker-end="url(#arrow)" />
    <text x="680" y="550" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">Frames</text>

    <!-- Whisper -> API -->
    <path d="M 430 620 L 430 460" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
    <text x="420" y="540" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#10b981" text-anchor="end">Transcript</text>

    <!-- BLIP -> API -->
    <path d="M 770 620 L 770 460" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
    <text x="780" y="540" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#10b981" text-anchor="start">Captions</text>

    <!-- API <-> LLM -->
    <path d="M 780 380 L 920 380" stroke="#f59e0b" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />
    <text x="850" y="370" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#f59e0b" text-anchor="middle">Context + Question</text>

    <path d="M 920 420 L 780 420" stroke="#f59e0b" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />
    <text x="850" y="445" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#f59e0b" text-anchor="middle">Answer &amp; Clip Data</text>


    <!-- Nodes -->

    <!-- User Interface -->
    <g transform="translate(50, 360)" filter="url(#shadow)">
        <rect width="220" height="80" rx="16" ry="16" fill="url(#uiGrad)" />
        <path d="M 30 40 H 50 M 30 30 H 60 M 30 50 H 40" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <text x="135" y="40" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">User Interface</text>
        <text x="135" y="60" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#fbcfe8" text-anchor="middle">Frontend (HTML/JS/CSS)</text>
    </g>

    <!-- External URL -->
    <g transform="translate(930, 200)" filter="url(#shadow)">
        <rect width="220" height="80" rx="16" ry="16" fill="#334155" stroke="#475569" stroke-width="2"/>
        <text x="110" y="40" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">YouTube / URL</text>
        <text x="110" y="60" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">External Media Source</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(420, 350)" filter="url(#shadow)">
        <rect width="360" height="100" rx="16" ry="16" fill="url(#apiGrad)" />
        <text x="180" y="45" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">FastAPI Server</text>
        <text x="180" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#ddd6fe" text-anchor="middle">API Orchestrator &amp; Router</text>
    </g>

    <!-- yt-dlp -->
    <g transform="translate(500, 210)" filter="url(#shadow)">
        <rect width="200" height="60" rx="12" ry="12" fill="url(#toolGrad)" />
        <text x="100" y="35" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">yt-dlp</text>
    </g>

    <!-- Video Processor -->
    <g transform="translate(470, 490)" filter="url(#shadow)">
        <rect width="260" height="70" rx="12" ry="12" fill="url(#toolGrad)" />
        <text x="130" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">OpenCV / MoviePy</text>
        <text x="130" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#bae6fd" text-anchor="middle">Video Processing &amp; Sub-clipping</text>
    </g>

    <!-- Whisper -->
    <g transform="translate(390, 620)" filter="url(#shadow)">
        <rect width="180" height="70" rx="12" ry="12" fill="url(#mlGrad)" />
        <text x="90" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Whisper STT</text>
        <text x="90" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#a7f3d0" text-anchor="middle">Audio Transcription</text>
    </g>

    <!-- BLIP -->
    <g transform="translate(630, 620)" filter="url(#shadow)">
        <rect width="180" height="70" rx="12" ry="12" fill="url(#mlGrad)" />
        <text x="90" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">BLIP Vision</text>
        <text x="90" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#a7f3d0" text-anchor="middle">Image Captioning</text>
    </g>

    <!-- LLM -->
    <g transform="translate(930, 350)" filter="url(#shadow)">
        <rect width="220" height="100" rx="16" ry="16" fill="url(#llmGrad)" />
        <text x="110" y="45" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Mistral-7B</text>
        <text x="110" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#fef3c7" text-anchor="middle">OpenRouter API</text>
    </g>

</svg>
